# OnionHost container engine config (rootful Podman, DESIGN-v3 A5/A18).
# Podman runtime entries take no arguments, so the flag injection A18
# requires (per-class --host-uds plus per-container network handling)
# lives in the wrapper itself: /usr/local/bin/runsc-wrap execs the
# pinned /usr/local/bin/runsc.
#
# Repo Review 2 task 20 (finding S1): runsc-wrap is the engine
# DEFAULT and the ONLY registered runtime. Plain crun and plain
# runsc are deliberately NOT registered: gVisor via the wrapper is
# the containment boundary, so a Quadlet unit that loses its
# PodmanArgs=--runtime=runsc-wrap line (owner edit, template slip)
# must still land in the wrapper - and if a container somehow runs
# under anything else, onionhost-runtime-gate stops its unit and
# raises a Dashboard card. The Quadlet units keep their explicit
# PodmanArgs line as the first, visible layer.
[engine]
runtime = "runsc-wrap"

[engine.runtimes]
runsc-wrap = ["/usr/local/bin/runsc-wrap"]
