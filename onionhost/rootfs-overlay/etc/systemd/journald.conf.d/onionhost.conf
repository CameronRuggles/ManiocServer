# OnionHost journal bounds (deanonymization audit R-24).
#
# The journal keeps a timestamped record of every boot and every
# service event; unbounded, it is a seized-running-box timeline
# of the household's power and usage patterns reaching back to
# the install. These settings cap the persistent journal at
# 256 MB (Debian's default can grow to 4 GB) and drop entries
# older than 90 days. The platform's own plain-text logs carry
# writer-side caps of their own (onionhost-update,
# onionhost-maintenance, onionhost-restore); this bounds the
# system record they mirror into.
[Journal]
SystemMaxUse=256M
SystemMaxFileSize=16M
MaxRetentionSec=90day
