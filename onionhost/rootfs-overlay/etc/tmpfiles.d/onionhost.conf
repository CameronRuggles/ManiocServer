# OnionHost runtime directories (tmpfs /run plumbing).
# /run/onionhost/web is the socket exchange between B (creates b1.sock)
# and A (connects through the host-owned http.sock symlink). It is
# world-writable like the PoC shared dir: B's nginx workers (www-data
# inside a userns) must be able to create their socket there.
d /run/onionhost 0755 root root -
d /run/onionhost/web 0777 root root -
d /run/onionhost/client 0755 root root -
# Socket dirs that tor BINDS in must be owned by the tor container's
# root (fixed UIDMap: A=2100000, U=2200000) and private - tor refuses
# listener dirs owned by anyone else or accessible to others
# ("needs to be accessible only by the user account that is running
# Tor"). Consumers reach the sockets as host root / via the
# privileged probe helper (DESIGN-v3 A4), never as the login user.
d /run/onionhost/client/socks 0700 2200000 2200000 -
d /run/onionhost/control 0700 2100000 2100000 -
