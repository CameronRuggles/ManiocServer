# OnionHost chrony configuration (DESIGN-v3 A8/DQ10).
#
# Replaces the Debian stock file. Differences, all deliberate:
#   - NO plain NTP pool. Time comes only from NTS-authenticated
#     servers listed in /etc/chrony/sources.d/onionhost-nts.sources.
#     Unauthenticated NTP lets an on-path attacker shift the clock
#     Tor depends on; that is the whole point of DQ10.
#   - NO /run/chrony-dhcp sourcedir: DHCP-pushed servers would be
#     plain, unauthenticated sources riding along silently.
#   - cmdport 0: chronyd serves time/control to NOBODY (DQ10).
#   - makestep only for the first 3 updates after start (step at
#     boot, slew afterwards - DQ10).
# RTC handling stays stock (rtcsync; Debian's /etc/adjtime declares
# the RTC to be UTC, which is DQ10's "RTC in UTC").

sourcedir /etc/chrony/sources.d
keyfile /etc/chrony/chrony.keys
driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
logdir /var/log/chrony
maxupdateskew 100.0
rtcsync
makestep 1 3
cmdport 0
leapseclist /usr/share/zoneinfo/leap-seconds.list
confdir /etc/chrony/conf.d
