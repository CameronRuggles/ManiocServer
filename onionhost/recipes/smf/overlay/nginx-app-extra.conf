# SMF recipe overlay (A23) - rendered to /etc/onionhost/
# nginx-app-extra.conf by onionhost-recipe at apply time; included
# by the golden app nginx config inside the server block.
#
# PHP execution is switched OFF in every directory the application
# itself (or its visitors, via uploads) can write to. SMF serves
# attachments through its own action (index.php?action=dlattach),
# never by executing files from these directories, and its cache
# and package files are include()d by the application, never
# requested directly - so nothing legitimate is lost, and an
# uploaded file can never become a running script. (Slice 6B flag
# 2: the platform does not do this for hand-installed apps; a
# recipe knows its app's upload directories, so the recipe does.)
#
# The mechanism matters: these must be PREFIX locations with ^~,
# not a regex deny. nginx checks prefix locations first and
# regex locations afterwards in file order - and the golden
# config's `location ~ \.php$` handler appears BEFORE this
# include, so a regex deny here is never reached for a .php
# request (found by the WordPress recipe's acceptance, whose
# first overlay draft used a regex and an uploaded .php
# executed). With ^~ the prefix wins before any regex is
# consulted, and everything under these directories is served
# as a static file or 404.
location ^~ /attachments/ {
    try_files $uri =404;
}
location ^~ /custom_avatar/ {
    try_files $uri =404;
}
location ^~ /cache/ {
    try_files $uri =404;
}
location ^~ /Packages/ {
    try_files $uri =404;
}
