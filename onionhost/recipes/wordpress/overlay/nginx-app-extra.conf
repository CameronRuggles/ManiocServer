# WordPress recipe overlay (A23) - rendered to /etc/onionhost/
# nginx-app-extra.conf by onionhost-recipe at apply time; included
# by the golden app nginx config inside the server block.
#
# PHP execution is switched OFF in the one directory tree visitors
# can put files into: wp-content/uploads (media library uploads,
# and anything a plugin writes there). WordPress serves uploads as
# static files, never by executing them, so nothing legitimate is
# lost - and an uploaded file can never become a running script.
# (Slice 6B flag 2: the platform does not do this for
# hand-installed apps; a recipe knows its app's upload directory,
# so the recipe does.)
#
# The mechanism matters: this must be a PREFIX location with ^~,
# not a regex deny. nginx checks prefix locations first and
# regex locations afterwards in file order - and the golden
# config's `location ~ \.php$` handler appears BEFORE this
# include, so a regex deny here would never be reached for a
# .php request (the first recipe build proved exactly that in
# its sandbox: an uploaded .php executed). With ^~ the uploads
# prefix wins before any regex is consulted, and everything
# under it is served as a static file or 404.
location ^~ /wp-content/uploads/ {
    try_files $uri =404;
}
# XML-RPC is disabled: its pingback machinery expects the open
# internet (and is a long-standing brute-force amplifier), and
# nothing in the sealed room can use it - remote publishing apps
# cannot reach this site except as visitors anyway. Everything
# else in WordPress works without it. An exact-match location
# outranks the regex PHP handler, so this deny is effective.
location = /xmlrpc.php {
    deny all;
}
# Deliberately NOT denied here: the installer (wp-admin/
# install.php). The recipe's install hook reaches it through
# this very edge socket during the first install, so an nginx
# deny would break installation itself. The protection is the
# platform's file discipline instead: the hook removes the
# installer and the database upgrader from the served tree the
# moment installation verifies, and every later apply excludes
# them - they never persist in a live tree (the same invariant
# the SMF recipe keeps by exclusion).
