# DokuWiki recipe overlay (A23) - rendered to /etc/onionhost/
# nginx-app-extra.conf by onionhost-recipe at apply time; included
# by the golden app nginx config inside the server block.
#
# DokuWiki keeps EVERYTHING in the docroot tree - its pages,
# media, configuration and user file all live in directories the
# web server must never serve directly. Upstream protects them
# with .htaccess files, which nginx does not read; left alone,
# the golden config would happily serve /data/pages/*.txt (the
# wiki's raw pages) and /conf/users.auth.php (the members'
# password hashes) to anyone who asked. These prefix locations
# close that: with ^~ they win over the golden config's PHP
# handler regex before it is consulted (the overlay lesson of
# recipes 1+2 - a regex deny here would never be reached).
#
# Nothing legitimate is lost: media is served by DokuWiki itself
# through lib/exe/fetch.php (a server-side read, unaffected by a
# web deny), pages render through doku.php, and the denied trees
# contain no web assets at all.
#
# The front door: the golden template's fallback hands the app
# the request path as DokuWiki's page id, so a request for "/"
# arrives as id="/" and DokuWiki answers with a 302 redirect to
# the canonical start page. Visitors' browsers follow it without
# noticing - but the platform's health checks (the updater's, the
# Dashboard's) require the site's root to answer 200, and would
# call a healthy wiki down. This exact-match location rewrites
# the root internally to the start page instead: one honest 200,
# no redirect, for the front door only - every other path keeps
# the golden behaviour.
location = / {
    rewrite ^ /doku.php?id=start last;
}
# The release-identifying files DokuWiki's archive leaves in
# its own root (deanonymization audit R-11): /VERSION prints the
# exact release ("2026-07-14c") to anyone who asks, and README /
# SECURITY.md corroborate it. Nothing in the running wiki links
# to them; exact-match locations outrank the golden config's
# static fallback, so the deny is reached.
location = /VERSION {
    deny all;
}
location = /README {
    deny all;
}
location = /SECURITY.md {
    deny all;
}
location ^~ /data/ {
    deny all;
}
location ^~ /conf/ {
    deny all;
}
location ^~ /inc/ {
    deny all;
}
location ^~ /bin/ {
    deny all;
}
location ^~ /vendor/ {
    deny all;
}
